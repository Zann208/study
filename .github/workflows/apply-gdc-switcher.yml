name: Apply GDC switcher
on:
  push:
    paths:
      - '.github/workflows/apply-gdc-switcher.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add switcher script
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('google-dc-hackathon/index.html'); s=p.read_text(); tag='<script src="./console-switcher.js?v=20260825c"></script>'
          if tag not in s: s=s.replace('</body>',tag+'\n</body>')
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add google-dc-hackathon/index.html
          git commit -m "Add console switcher to GDC console" || exit 0
          git push
